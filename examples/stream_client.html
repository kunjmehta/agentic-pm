<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #212121;
            color: #ececec;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Header ── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            border-bottom: 1px solid #333;
            background: #2b2b2b;
            flex-shrink: 0;
        }
        .header-title { font-size: 15px; font-weight: 600; color: #ececec; }
        .header-right { display: flex; align-items: center; gap: 10px; }
        .thread-label { font-size: 11px; color: #888; font-family: monospace; }
        .backtest-toggle { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #888; cursor: pointer; white-space: nowrap; }
        .backtest-toggle input { accent-color: #a78bfa; cursor: pointer; }
        .btn-new {
            background: #333;
            color: #ececec;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 5px 12px;
            font-size: 12px;
            cursor: pointer;
        }
        .btn-new:hover { background: #3a3a3a; }
        .btn-api {
            background: #2a2a2a;
            color: #888;
            border: 1px solid #3a3a3a;
            border-radius: 5px;
            padding: 4px 9px;
            font-size: 11px;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-api:hover { background: #333; color: #ccc; }
        .btn-api.active { background: #1a3a5c; color: #7cb9ff; border-color: #2f6fdb; }
        .api-url-input {
            background: #333;
            border: 1px solid #444;
            border-radius: 6px;
            color: #ececec;
            font-size: 12px;
            padding: 4px 8px;
            width: 200px;
        }

        /* ── Message area ── */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 0;
            display: flex;
            flex-direction: column;
            gap: 0;
        }
        .messages::-webkit-scrollbar { width: 6px; }
        .messages::-webkit-scrollbar-track { background: transparent; }
        .messages::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

        .msg-row {
            display: flex;
            padding: 8px 20%;
            gap: 14px;
        }
        .msg-row.user { justify-content: flex-end; }
        .msg-row.assistant { justify-content: flex-start; }

        .bubble {
            max-width: 720px;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.65;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .bubble.user {
            background: #2f6fdb;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .bubble.assistant {
            background: #2b2b2b;
            border: 1px solid #333;
            color: #ececec;
            border-bottom-left-radius: 4px;
            min-width: 200px;
        }

        /* Thinking section inside assistant bubble */
        details.thinking {
            margin-bottom: 10px;
            border: 1px solid #3a3a3a;
            border-radius: 6px;
            overflow: hidden;
        }
        details.thinking summary {
            padding: 6px 10px;
            font-size: 12px;
            color: #a78bfa;
            cursor: pointer;
            background: #1e1e2e;
            user-select: none;
            list-style: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        details.thinking summary::-webkit-details-marker { display: none; }
        details.thinking summary::before { content: '▶'; font-size: 9px; transition: transform 0.2s; }
        details[open].thinking summary::before { transform: rotate(90deg); }
        .thinking-content {
            padding: 8px 10px;
            font-size: 12px;
            color: #9d9dbd;
            background: #1a1a2e;
            white-space: pre-wrap;
            line-height: 1.5;
        }

        /* Tool call badges */
        .tool-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #1e3a5f;
            border: 1px solid #2a5298;
            color: #7eb8f7;
            border-radius: 4px;
            padding: 2px 7px;
            font-size: 11px;
            font-family: monospace;
            margin: 2px 2px 4px 0;
        }

        /* Text content area */
        .text-content { margin-top: 6px; line-height: 1.55; }

        /* Markdown rendering inside chat bubbles */
        .text-content h1, .text-content h2 {
            font-size: 13px; font-weight: 700; color: #a78bfa;
            margin: 10px 0 4px; padding-bottom: 3px;
            border-bottom: 1px solid #3a3a4a;
        }
        .text-content h3 {
            font-size: 12px; font-weight: 600; color: #c4b5fd;
            margin: 8px 0 3px;
        }
        .text-content p { margin: 4px 0; }
        .text-content strong { color: #e2e8f0; }
        .text-content em { color: #94a3b8; }
        .text-content hr { border: none; border-top: 1px solid #333; margin: 8px 0; }
        .text-content ul, .text-content ol { padding-left: 18px; margin: 4px 0; }
        .text-content li { margin: 2px 0; }
        .text-content blockquote {
            border-left: 3px solid #a78bfa; padding-left: 10px;
            color: #94a3b8; margin: 6px 0; font-style: italic;
        }
        .text-content table {
            border-collapse: collapse; width: 100%;
            font-size: 12px; margin: 6px 0;
        }
        .text-content th {
            background: #2c2c3a; color: #a78bfa;
            padding: 5px 10px; text-align: left;
            border: 1px solid #3a3a4a; font-weight: 600;
        }
        .text-content td {
            padding: 4px 10px; border: 1px solid #2a2a3a;
        }
        .text-content tr:nth-child(even) td { background: #1e1e28; }
        .text-content code {
            background: #2c2c3a; padding: 1px 5px; border-radius: 3px;
            font-family: monospace; font-size: 11px; color: #e2e8f0;
        }

        /* Spinner */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #444;
            border-top-color: #888;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Error */
        .error-block {
            color: #f87171;
            background: #2d1515;
            border: 1px solid #7f1d1d;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 13px;
            margin-top: 6px;
        }

        /* Quant / Backtest result cards */
        .result-card {
            border-radius: 7px;
            padding: 9px 12px;
            font-size: 12px;
            margin: 4px 0;
            font-family: monospace;
        }
        .result-card.quant {
            background: #0f2d1e;
            border: 1px solid #1a5c3a;
            color: #6ee7b7;
        }
        .result-card.backtest {
            background: #1a1a00;
            border: 1px solid #4d4400;
            color: #fde68a;
        }
        .result-card.error {
            background: #2d1515;
            border: 1px solid #7f1d1d;
            color: #f87171;
        }
        .result-card-header {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .result-card-body {
            color: #aaa;
            font-size: 11px;
            line-height: 1.6;
        }
        .result-card-body span.val { color: #e5e5e5; }
        details.result-detail { margin-top: 5px; }
        details.result-detail summary {
            font-size: 11px;
            color: #888;
            cursor: pointer;
            list-style: none;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        details.result-detail summary::before { content: '▶'; font-size: 8px; }
        details[open].result-detail summary::before { transform: rotate(90deg); display: inline-block; }
        .result-detail-body {
            margin-top: 4px;
            padding: 6px 8px;
            background: rgba(0,0,0,0.25);
            border-radius: 4px;
            font-size: 10.5px;
            color: #9d9d9d;
            white-space: pre-wrap;
            max-height: 180px;
            overflow-y: auto;
        }

        /* Welcome / empty state */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 40px;
        }
        .empty-state h2 { font-size: 22px; color: #ececec; }
        .suggestions { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 480px; }
        .suggestion {
            background: #2b2b2b;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            color: #ccc;
            cursor: pointer;
            text-align: left;
        }
        .suggestion:hover { background: #333; border-color: #555; }

        /* ── Input bar ── */
        .input-bar {
            flex-shrink: 0;
            padding: 14px 20%;
            background: #212121;
            border-top: 1px solid #2e2e2e;
        }
        .input-wrap {
            display: flex;
            align-items: flex-end;
            background: #2b2b2b;
            border: 1px solid #3a3a3a;
            border-radius: 12px;
            padding: 10px 14px;
            gap: 10px;
            transition: border-color 0.2s;
        }
        .input-wrap:focus-within { border-color: #555; }
        textarea#queryInput {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ececec;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            max-height: 200px;
            overflow-y: auto;
            font-family: inherit;
        }
        textarea#queryInput::placeholder { color: #666; }
        .send-btn {
            background: #2f6fdb;
            color: white;
            border: none;
            border-radius: 8px;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.2s;
        }
        .send-btn:hover { background: #1f5cc4; }
        .send-btn:disabled { background: #333; color: #555; cursor: not-allowed; }
        .send-btn svg { width: 16px; height: 16px; }
        .input-hint { font-size: 11px; color: #555; text-align: center; margin-top: 6px; }

        /* ── Semi-Auto task preview (HITL) ── */
        .task-preview {
            background: #1a2035;
            border: 1px solid #2a4070;
            border-radius: 8px;
            padding: 12px 14px;
            margin-top: 8px;
        }
        .task-preview-header {
            font-weight: 600;
            color: #7cb9ff;
            font-size: 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        details.task-reasoning {
            background: #12152a;
            border: 1px solid #252850;
            border-radius: 6px;
            margin-bottom: 8px;
            overflow: hidden;
        }
        details.task-reasoning summary {
            padding: 6px 10px;
            font-size: 12px;
            color: #a78bfa;
            cursor: pointer;
            user-select: none;
            list-style: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        details.task-reasoning summary::-webkit-details-marker { display: none; }
        details.task-reasoning summary::before { content: '▶'; font-size: 9px; transition: transform 0.2s; }
        details[open].task-reasoning summary::before { transform: rotate(90deg); }
        .task-reasoning-body {
            padding: 8px 10px;
            font-size: 12px;
            color: #9d9dbd;
            white-space: pre-wrap;
            line-height: 1.5;
        }
        .task-table-label {
            color: #888;
            font-size: 11px;
            margin: 8px 0 3px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .task-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            margin-bottom: 6px;
            font-family: monospace;
        }
        .task-table th {
            text-align: left;
            color: #666;
            padding: 3px 6px;
            border-bottom: 1px solid #2a2a3a;
            font-weight: 500;
        }
        .task-table td {
            padding: 3px 6px;
            color: #bbb;
            border-bottom: 1px solid #1e1e2e;
        }
        .task-table tr:last-child td { border-bottom: none; }
        .approve-row { display: flex; gap: 8px; margin-top: 12px; }
        .btn-approve {
            flex: 1;
            background: #0f2d1a;
            color: #6ee7b7;
            border: 1px solid #1a5c3a;
            border-radius: 7px;
            padding: 8px 16px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.15s;
        }
        .btn-approve:hover:not(:disabled) { background: #143820; }
        .btn-approve:disabled { opacity: 0.45; cursor: not-allowed; }
        .btn-reject {
            flex: 1;
            background: #2a1010;
            color: #f87171;
            border: 1px solid #7f1d1d;
            border-radius: 7px;
            padding: 8px 16px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .btn-reject:hover:not(:disabled) { background: #351515; }
        .btn-reject:disabled { opacity: 0.45; cursor: not-allowed; }
        .exec-summary {
            background: #0f1a0f;
            border: 1px solid #1a3a1a;
            border-radius: 6px;
            padding: 8px 10px;
            margin-top: 8px;
            font-size: 11px;
            font-family: monospace;
            color: #888;
        }
        .exec-summary-row { display: flex; gap: 12px; padding: 2px 0; }
        .exec-summary-row .esid { color: #6ee7b7; min-width: 80px; }
        .exec-summary-row .esfn { color: #bbb; flex: 1; }
        .exec-summary-row .esstatus { min-width: 60px; }
        .esstatus.success { color: #6ee7b7; }
        .esstatus.error { color: #f87171; }
        .esstatus.skipped { color: #888; }

        /* ── Health badge ── */
        .health-section {
            margin-top: 8px;
            padding: 9px 12px;
            background: #111a11;
            border: 1px solid #1a3a1a;
            border-radius: 7px;
            font-size: 12px;
        }
        .health-section-header {
            font-weight: 600;
            color: #888;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 6px;
        }
        .health-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            border: 1px solid;
            font-weight: 700;
            font-size: 11px;
            letter-spacing: 0.06em;
            margin-right: 8px;
            vertical-align: middle;
        }
        .health-metrics {
            margin-top: 6px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px 14px;
            font-family: monospace;
            font-size: 11px;
        }
        .health-metrics .hm-row { display: flex; gap: 4px; }
        .health-metrics .hm-key { color: #666; }
        .health-metrics .hm-val { color: #bbb; }

        /* ── Portfolio stats cards ── */
        .stats-section {
            margin-top: 8px;
            padding: 9px 12px;
            background: #0f1829;
            border: 1px solid #1e3a5f;
            border-radius: 7px;
            font-size: 12px;
        }
        .stats-section-header {
            font-weight: 600;
            color: #888;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 8px;
        }
        .stats-cards {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .stat-card {
            background: #132035;
            border: 1px solid #1e3a5f;
            border-radius: 6px;
            padding: 7px 12px;
            min-width: 100px;
        }
        .stat-card .sc-label { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 0.04em; }
        .stat-card .sc-value { font-size: 16px; font-weight: 600; color: #7cb9ff; margin-top: 2px; }
        .stat-card .sc-value.positive { color: #6ee7b7; }
        .stat-card .sc-value.negative { color: #f87171; }

        /* ── Trades table ── */
        .trades-section {
            margin-top: 8px;
        }
        details.trades-detail {
            background: #161600;
            border: 1px solid #4d4400;
            border-radius: 7px;
            overflow: hidden;
        }
        details.trades-detail summary {
            padding: 7px 12px;
            font-size: 12px;
            color: #fde68a;
            cursor: pointer;
            user-select: none;
            list-style: none;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }
        details.trades-detail summary::-webkit-details-marker { display: none; }
        details.trades-detail summary::before { content: '▶'; font-size: 9px; transition: transform 0.2s; }
        details[open].trades-detail summary::before { transform: rotate(90deg); }
        .trades-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            font-family: monospace;
        }
        .trades-table th {
            text-align: left;
            color: #666;
            padding: 4px 8px;
            border-bottom: 1px solid #2a2a00;
            font-weight: 500;
        }
        .trades-table td {
            padding: 3px 8px;
            color: #ccc;
            border-bottom: 1px solid #1e1e00;
        }
        .trades-table tr:last-child td { border-bottom: none; }
        .trade-buy { color: #6ee7b7; }
        .trade-sell { color: #f87171; }
        .trade-pnl-pos { color: #6ee7b7; }
        .trade-pnl-neg { color: #f87171; }
        /* Sub-section headers separating BUY entries from SELL exits */
        .trades-sub-header {
            padding: 5px 12px 4px;
            font-size: 11px;
            font-family: monospace;
            font-weight: 700;
            letter-spacing: 0.04em;
            display: flex;
            align-items: center;
            gap: 8px;
            border-top: 1px solid #2a2a00;
        }
        .trades-sub-header:first-of-type { border-top: none; }
        .trade-buy-header { color: #6ee7b7; background: rgba(110,231,183,0.04); }
        .trade-sell-header { color: #f87171; background: rgba(248,113,113,0.04); }
        .trades-count {
            font-size: 10px;
            font-weight: 400;
            color: #666;
            margin-left: auto;
        }
        .trades-open-note {
            padding: 5px 12px;
            font-size: 10.5px;
            font-family: monospace;
            color: #a78bfa;
            border-top: 1px solid #2a2a00;
        }
        .trades-table .tc-num { color: #555; width: 28px; }
        .trades-table .tc-signal { color: #888; font-size: 10px; }

        /* ── Telemetry panel ── */
        details.telemetry-detail {
            margin-top: 8px;
            background: #0f0f0f;
            border: 1px solid #2a2a2a;
            border-radius: 7px;
            overflow: hidden;
        }
        details.telemetry-detail summary {
            padding: 7px 12px;
            font-size: 11px;
            color: #666;
            cursor: pointer;
            user-select: none;
            list-style: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        details.telemetry-detail summary::-webkit-details-marker { display: none; }
        details.telemetry-detail summary::before { content: '▶'; font-size: 8px; }
        details[open].telemetry-detail summary::before { transform: rotate(90deg); display: inline-block; }
        .telemetry-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 10.5px;
            font-family: monospace;
        }
        .telemetry-table th {
            text-align: left;
            color: #555;
            padding: 3px 8px;
            border-bottom: 1px solid #222;
            font-weight: 500;
        }
        .telemetry-table td {
            padding: 2px 8px;
            color: #888;
            border-bottom: 1px solid #1a1a1a;
        }
        .telemetry-table tr:last-child td { border-bottom: none; }
        .telemetry-table .tc-fn { color: #aaa; }
        .telemetry-table .tc-dur { color: #7cb9ff; }
    </style>
</head>
<body>

<div class="header">
    <span class="header-title">🤖 Portfolio Manager</span>
    <div class="header-right">
        <button class="btn-api active" id="btnLangGraph" onclick="setApi('http://localhost:8001/v1', this)">Graph</button>
        <button class="btn-api" id="btnAgentic" onclick="setApi('http://localhost:8000', this)">Agentic</button>
        <button class="btn-api" id="btnSemiAuto" onclick="setApi('http://localhost:8000/v1', this)">Semi-Auto</button>
        <input class="api-url-input" id="apiUrl" value="http://localhost:8001/v1" placeholder="http://localhost:8001/v1" oninput="clearApiPreset()">
        <label class="backtest-toggle" title="Bypass market-hours guard (required outside NYSE hours)">
            <input type="checkbox" id="backtestMode" checked>
            backtest mode
        </label>
        <span class="thread-label" id="threadLabel"></span>
        <button class="btn-new" onclick="newChat()">+ New Chat</button>
    </div>
</div>

<div class="messages" id="messages">
    <div class="empty-state" id="emptyState">
        <h2>Portfolio Manager</h2>
        <div class="suggestions">
            <button class="suggestion" onclick="send('What is my portfolio status?')">What is my portfolio status?</button>
            <button class="suggestion" onclick="send('Is my portfolio healthy? Check risk limits.')">Is my portfolio healthy? Check risk limits.</button>
            <button class="suggestion" onclick="send('Should I buy AAPL? Run technical analysis.')">Should I buy AAPL? Run technical analysis.</button>
            <button class="suggestion" onclick="send('Backtest a mean-reversion strategy on AAPL for Jan 2024')">Backtest a mean-reversion strategy on AAPL for Jan 2024</button>
        </div>
    </div>
</div>

<div class="input-bar">
    <div class="input-wrap">
        <textarea id="queryInput" rows="1" placeholder="Message Portfolio Manager..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="send()" title="Send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
            </svg>
        </button>
    </div>
    <div class="input-hint">Enter to send · Shift+Enter for newline</div>
</div>

<script>
    const CONV_DIR = 'data/conversations'; // for reference only
    let threadId = localStorage.getItem('threadId') || crypto.randomUUID();
    let isStreaming = false;

    // Persist thread
    localStorage.setItem('threadId', threadId);
    document.getElementById('threadLabel').textContent = threadId.slice(0, 8) + '…';

    // Restore saved API URL preference
    const savedApi = localStorage.getItem('apiUrl');
    if (savedApi) {
        document.getElementById('apiUrl').value = savedApi;
        document.getElementById('btnLangGraph').classList.toggle('active', savedApi === 'http://localhost:8001/v1');
        document.getElementById('btnAgentic').classList.toggle('active', savedApi === 'http://localhost:8000');
        document.getElementById('btnSemiAuto').classList.toggle('active', savedApi === 'http://localhost:8000/v1');
    }

    // ── API preset switcher ────────────────────────────────────
    function setApi(url, btn) {
        document.getElementById('apiUrl').value = url;
        localStorage.setItem('apiUrl', url);
        document.querySelectorAll('.btn-api').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');
    }

    function clearApiPreset() {
        document.querySelectorAll('.btn-api').forEach(b => b.classList.remove('active'));
        localStorage.setItem('apiUrl', document.getElementById('apiUrl').value);
    }

    // ── Load history ──────────────────────────────────────────
    async function loadHistory() {
        const apiUrl = document.getElementById('apiUrl').value;
        try {
            const res = await fetch(`${apiUrl}/conversations/${threadId}`);
            if (!res.ok) return;
            const data = await res.json();
            const turns = data.turns || [];
            if (turns.length === 0) return;

            hideEmptyState();
            for (const turn of turns) {
                // User bubble
                if (turn.query) appendUserBubble(turn.query);

                // Assistant bubble
                const bubble = appendAssistantBubble();
                removeSpinner(bubble);

                if (turn.final_response) {
                    // Completed turn — show execution summary then response
                    const execList = turn.execution_results || [];
                    if (execList.length > 0) addExecSummary(bubble, execList);
                    addText(bubble, turn.final_response);
                } else if (turn.status === 'pending_approval') {
                    // Interrupted turn that was never approved
                    const notice = document.createElement('div');
                    notice.style.cssText = 'color:#888;font-size:12px;font-style:italic;padding:4px 0;';
                    notice.textContent = '⏳ Awaiting approval (session ended before execution)';
                    bubble.appendChild(notice);
                } else {
                    addText(bubble, '(no response recorded)');
                }
            }
        } catch (e) {
            console.warn('Could not load history:', e);
        }
    }

    loadHistory();

    // ── New chat ──────────────────────────────────────────────
    function newChat() {
        threadId = crypto.randomUUID();
        localStorage.setItem('threadId', threadId);
        document.getElementById('threadLabel').textContent = threadId.slice(0, 8) + '…';
        document.getElementById('messages').innerHTML = '';
        showEmptyState();
    }

    // ── Semi-Auto detection ───────────────────────────────────
    function isSemiAuto() {
        // Must include /v1 to distinguish from Agentic (also on 8000 but no /v1)
        return document.getElementById('apiUrl').value.includes(':8000/v1');
    }

    // ── Send ──────────────────────────────────────────────────
    async function send(text) {
        const input = document.getElementById('queryInput');
        const query = text || input.value.trim();
        if (!query || isStreaming) return;

        const apiUrl = document.getElementById('apiUrl').value;
        input.value = '';
        autoResize(input);
        isStreaming = true;
        document.getElementById('sendBtn').disabled = true;

        hideEmptyState();
        appendUserBubble(query);
        const bubble = appendAssistantBubble();

        if (isSemiAuto()) {
            await sendSemiAuto(query, bubble, apiUrl);
            return;
        }

        let thinkingEl = null;
        let thinkingContent = null;
        let toolSet = new Set();

        try {
            const res = await fetch(`${apiUrl}/query/stream`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query, thread_id: threadId, apply_middleware: true, backtest_mode: document.getElementById('backtestMode').checked })
            });

            if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`);

            const reader = res.body.getReader();
            const dec = new TextDecoder();

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                const lines = dec.decode(value).split('\n');
                for (const line of lines) {
                    if (!line.startsWith('data: ')) continue;
                    let evt;
                    try { evt = JSON.parse(line.slice(6)); } catch { continue; }

                    if (evt.type === 'reasoning' && evt.content) {
                        if (!thinkingEl) {
                            [thinkingEl, thinkingContent] = addThinkingStream(bubble);
                        }
                        thinkingContent.textContent += evt.content;
                        scrollMessages();
                    } else if (evt.type === 'text' && evt.content) {
                        addText(bubble, evt.content);
                        scrollMessages();
                    } else if (evt.type === 'tool_call') {
                        const name = extractToolName(evt.content);
                        if (name && !toolSet.has(name)) {
                            toolSet.add(name);
                            addToolBadge(bubble, name);
                        }
                    } else if (evt.type === 'node') {
                        // LangGraph node events — map to readable badge labels
                        const nodeName = evt.node || '';
                        const NODE_LABELS = {
                            'portfolio_agent_node': 'portfolio agent',
                            'quant_router':         'quant router',
                            'backtester_router':    'backtester router',
                            'result_aggregator':    'aggregating results',
                            'synthesizer':          'synthesizer',
                            'classify_intent':      'classify intent',
                            'market_hours_guard':   'market hours',
                            'portfolio_guard':      'portfolio guard',
                        };
                        const label = NODE_LABELS[nodeName];
                        if (label && !toolSet.has(nodeName)) {
                            toolSet.add(nodeName);
                            addToolBadge(bubble, label);
                        }
                    } else if (evt.type === 'quant_result') {
                        // Parallel quant router result arriving from fan-out
                        addQuantResultCard(bubble, evt.result || evt);
                        scrollMessages();
                    } else if (evt.type === 'backtest_result') {
                        // Parallel backtester router result arriving from fan-out
                        addBacktestResultCard(bubble, evt.result || evt);
                        scrollMessages();
                    } else if (evt.type === 'status') {
                        // Processing status — shown only if no content yet
                        if (!bubble.querySelector('.text-content') && evt.message) {
                            addText(bubble, '');  // ensure container exists
                        }
                    } else if (evt.type === 'error') {
                        addError(bubble, evt.error || evt.content || 'Unknown error');
                    } else if (evt.type === 'done') {
                        break;
                    }
                }
            }

        } catch (e) {
            addError(bubble, e.message);
        } finally {
            removeSpinner(bubble);
            isStreaming = false;
            document.getElementById('sendBtn').disabled = false;
            input.focus();
        }
    }

    // ── DOM helpers ───────────────────────────────────────────
    function hideEmptyState() {
        const e = document.getElementById('emptyState');
        if (e) e.remove();
    }
    function showEmptyState() {
        const msgs = document.getElementById('messages');
        msgs.innerHTML = `
        <div class="empty-state" id="emptyState">
            <h2>Portfolio Manager</h2>
            <div class="suggestions">
                <button class="suggestion" onclick="send('What is my portfolio status?')">What is my portfolio status?</button>
                <button class="suggestion" onclick="send('Is my portfolio healthy? Check risk limits.')">Is my portfolio healthy? Check risk limits.</button>
                <button class="suggestion" onclick="send('Should I buy AAPL? Run technical analysis.')">Should I buy AAPL? Run technical analysis.</button>
                <button class="suggestion" onclick="send('Backtest a mean-reversion strategy on AAPL for Jan 2024')">Backtest a mean-reversion strategy on AAPL for Jan 2024</button>
            </div>
        </div>`;
    }

    function appendUserBubble(text) {
        const row = document.createElement('div');
        row.className = 'msg-row user';
        row.innerHTML = `<div class="bubble user">${escHtml(text)}</div>`;
        document.getElementById('messages').appendChild(row);
        scrollMessages();
        return row;
    }

    function appendAssistantBubble() {
        const row = document.createElement('div');
        row.className = 'msg-row assistant';
        row.innerHTML = `<div class="bubble assistant"><span class="spinner"></span></div>`;
        document.getElementById('messages').appendChild(row);
        scrollMessages();
        return row.querySelector('.bubble.assistant');
    }

    function addThinking(bubble, text) {
        const details = document.createElement('details');
        details.className = 'thinking';
        details.innerHTML = `<summary>💭 Thinking</summary><div class="thinking-content">${escHtml(text)}</div>`;
        bubble.insertBefore(details, bubble.querySelector('.spinner'));
        return details;
    }

    function addThinkingStream(bubble) {
        const details = document.createElement('details');
        details.className = 'thinking';
        const content = document.createElement('div');
        content.className = 'thinking-content';
        const summary = document.createElement('summary');
        summary.textContent = '💭 Thinking';
        details.appendChild(summary);
        details.appendChild(content);
        const spinner = bubble.querySelector('.spinner');
        if (spinner) bubble.insertBefore(details, spinner);
        else bubble.appendChild(details);
        return [details, content];
    }

    function addToolBadge(bubble, name) {
        const badge = document.createElement('span');
        badge.className = 'tool-badge';
        badge.textContent = '🔧 ' + name;
        const spinner = bubble.querySelector('.spinner');
        const textDiv = bubble.querySelector('.text-content');
        if (spinner) bubble.insertBefore(badge, spinner);
        else if (textDiv) bubble.insertBefore(badge, textDiv);
        else bubble.appendChild(badge);
    }

    function addText(bubble, text) {
        let div = bubble.querySelector('.text-content');
        if (!div) {
            div = document.createElement('div');
            div.className = 'text-content';
            bubble.appendChild(div);
        }
        // Render markdown if marked.js is available, otherwise plain text
        if (typeof marked !== 'undefined') {
            div.innerHTML += marked.parse(String(text), { breaks: true, gfm: true });
        } else {
            div.textContent += text;
        }
    }

    function addError(bubble, msg) {
        const div = document.createElement('div');
        div.className = 'error-block';
        div.textContent = '❌ ' + msg;
        bubble.appendChild(div);
    }

    function removeSpinner(bubble) {
        const s = bubble.querySelector('.spinner');
        if (s) s.remove();
    }

    function scrollMessages() {
        const m = document.getElementById('messages');
        m.scrollTop = m.scrollHeight;
    }

    function extractToolName(content) {
        if (!content) return null;
        if (typeof content === 'string') return content;
        if (typeof content === 'object') {
            // Try to find tool name in messages array
            const msgs = content.messages || [];
            for (const m of msgs) {
                if (m && m.name) return m.name;
                if (m && m.tool_calls) {
                    for (const tc of m.tool_calls) {
                        if (tc && tc.function && tc.function.name) return tc.function.name;
                    }
                }
            }
        }
        return 'tool';
    }

    function addQuantResultCard(bubble, result) {
        const isErr = result.source === 'error' || !!result.error;
        const card = document.createElement('div');
        card.className = 'result-card quant' + (isErr ? ' error' : '');

        const symbol = result.symbol || '—';
        const atype  = result.analysis_type || 'full';
        const source = result.source || '—';
        const keys   = Object.keys(result.indicators || {}).join(', ') || 'none';

        card.innerHTML = `
            <div class="result-card-header">📊 Quant — ${escHtml(symbol)}</div>
            <div class="result-card-body">
                type: <span class="val">${escHtml(atype)}</span> &nbsp;
                source: <span class="val">${escHtml(source)}</span>
                ${isErr ? `<br><span style="color:#f87171">error: ${escHtml(result.error||'')}</span>` : ''}
                ${!isErr && keys !== 'none' ? `
                <details class="result-detail">
                    <summary>indicators (${keys.split(',').length})</summary>
                    <div class="result-detail-body">${escHtml(keys)}</div>
                </details>` : ''}
            </div>`;
        const spinner = bubble.querySelector('.spinner');
        const textDiv = bubble.querySelector('.text-content');
        if (spinner) bubble.insertBefore(card, spinner);
        else if (textDiv) bubble.insertBefore(card, textDiv);
        else bubble.appendChild(card);
    }

    function addBacktestResultCard(bubble, result) {
        const isErr = !!result.error;
        const card = document.createElement('div');
        card.className = 'result-card backtest' + (isErr ? ' error' : '');

        const wf     = result.workflow || '—';
        const symbol = result.symbol   || '(portfolio)';
        const runId  = result.run_id   || '—';

        card.innerHTML = `
            <div class="result-card-header">📈 Backtest — Workflow ${escHtml(wf)} &nbsp;·&nbsp; ${escHtml(symbol)}</div>
            <div class="result-card-body">
                run_id: <span class="val">${escHtml(runId)}</span>
                ${isErr ? `<br><span style="color:#f87171">error: ${escHtml(result.error||'')}</span>` : ''}
                ${!isErr && result.result && Object.keys(result.result).length > 0 ? `
                <details class="result-detail">
                    <summary>result details</summary>
                    <div class="result-detail-body">${escHtml(JSON.stringify(result.result, null, 2))}</div>
                </details>` : ''}
            </div>`;
        const spinner = bubble.querySelector('.spinner');
        const textDiv = bubble.querySelector('.text-content');
        if (spinner) bubble.insertBefore(card, spinner);
        else if (textDiv) bubble.insertBefore(card, textDiv);
        else bubble.appendChild(card);
    }

    function escHtml(t) {
        return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ── Input handling ────────────────────────────────────────
    function handleKey(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            send();
        }
    }

    function autoResize(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 200) + 'px';
    }

    // ── Semi-Auto HITL flow ───────────────────────────────────

    async function sendSemiAuto(query, bubble, apiUrl) {
        // Per-agent thought buffers for incremental display
        const thoughtEls = {};   // agent → {details, content} DOM elements
        let interruptData = null;
        let finalText = null;

        function getOrCreateThought(agent) {
            if (!thoughtEls[agent]) {
                const details = document.createElement('details');
                details.className = 'thinking';
                details.open = true;
                const summary = document.createElement('summary');
                const agentLabel = agent.charAt(0).toUpperCase() + agent.slice(1);
                summary.textContent = `💭 ${agentLabel} thinking…`;
                const content = document.createElement('div');
                content.className = 'thinking-content';
                details.appendChild(summary);
                details.appendChild(content);
                const spinner = bubble.querySelector('.spinner');
                if (spinner) bubble.insertBefore(details, spinner);
                else bubble.appendChild(details);
                thoughtEls[agent] = { details, content, summary };
                scrollMessages();
            }
            return thoughtEls[agent];
        }

        try {
            // Phase 1: SSE stream — reasoning nodes + token-level thought_delta
            const res = await fetch(`${apiUrl}/query/stream`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    query,
                    thread_id: threadId,
                    backtest_mode: document.getElementById('backtestMode').checked,
                })
            });

            if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`);

            const reader = res.body.getReader();
            const dec = new TextDecoder();

            outer: while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                const lines = dec.decode(value).split('\n');
                for (const line of lines) {
                    if (!line.startsWith('data: ')) continue;
                    let evt;
                    try { evt = JSON.parse(line.slice(6)); } catch { continue; }

                    if (evt.type === 'thought_delta' && evt.agent && evt.token) {
                        // Append token to the agent's thinking block
                        const el = getOrCreateThought(evt.agent);
                        el.content.textContent += evt.token;
                        scrollMessages();

                    } else if (evt.type === 'reasoning' && evt.agent) {
                        // Finalise the thinking block: collapse + update summary label
                        const el = thoughtEls[evt.agent];
                        if (el) {
                            el.details.open = false;
                            const agentLabel = evt.agent.charAt(0).toUpperCase() + evt.agent.slice(1);
                            el.summary.textContent = `💭 ${agentLabel} reasoning (${(evt.tasks || []).length} tasks)`;
                        }

                    } else if (evt.type === 'interrupt') {
                        interruptData = evt;

                    } else if (evt.type === 'text' && evt.content) {
                        finalText = evt.content;

                    } else if (evt.type === 'error') {
                        addError(bubble, evt.content || 'Unknown error');

                    } else if (evt.type === 'done') {
                        break outer;
                    }
                }
            }

            removeSpinner(bubble);

            if (finalText) {
                // Guard short-circuit (market closed, synthesizer response)
                addText(bubble, finalText);
                isStreaming = false;
                document.getElementById('sendBtn').disabled = false;
                return;
            }

            if (interruptData) {
                // Map interrupt event tasks_preview → showTaskPreview format
                const tp = interruptData.tasks_preview || {};
                const previewData = {
                    thread_id: interruptData.thread_id,
                    portfolio_tasks:  tp.portfolio  || [],
                    quant_tasks:      tp.quant      || [],
                    backtester_tasks: tp.backtester || [],
                    // Reasoning text captured in thought blocks above — not duplicated here
                };
                showTaskPreview(bubble, previewData, apiUrl);
                return;
            }

        } catch (e) {
            removeSpinner(bubble);
            addError(bubble, e.message);
            isStreaming = false;
            document.getElementById('sendBtn').disabled = false;
        }
    }

    function showTaskPreview(bubble, data, apiUrl) {
        const preview = document.createElement('div');
        preview.className = 'task-preview';

        // Header
        const hdr = document.createElement('div');
        hdr.className = 'task-preview-header';
        hdr.innerHTML = '🔍 Task Preview — Review before execution';
        preview.appendChild(hdr);

        // Reasoning sections
        const agents = [
            { key: 'portfolio_reasoning', label: '🏦 Portfolio Manager reasoning' },
            { key: 'quant_reasoning',     label: '📊 Quant reasoning' },
            { key: 'backtester_reasoning',label: '📈 Backtester reasoning' },
        ];
        for (const { key, label } of agents) {
            if (!data[key]) continue;
            const det = document.createElement('details');
            det.className = 'task-reasoning';
            det.open = true;
            det.innerHTML = `<summary>${label}</summary><div class="task-reasoning-body">${escHtml(data[key])}</div>`;
            preview.appendChild(det);
        }

        // PM supervisor review verdict (shown when sub-agents ran)
        if (data.pm_review_notes) {
            const verdict = document.createElement('div');
            verdict.style.cssText = 'background:#0d1f0d;border:1px solid #1a4a1a;border-radius:6px;padding:8px 12px;margin-bottom:8px;font-size:12px;color:#6ee7b7;';
            verdict.innerHTML = `<strong style="color:#a3e6bc">🤖 PM Review:</strong> ${escHtml(data.pm_review_notes)}`;
            preview.appendChild(verdict);
        }

        // Task tables
        const queues = [
            { key: 'portfolio_tasks', label: 'Portfolio tasks' },
            { key: 'quant_tasks',     label: 'Quant tasks' },
            { key: 'backtester_tasks',label: 'Backtester tasks' },
        ];
        for (const { key, label } of queues) {
            const tasks = data[key];
            if (!tasks || tasks.length === 0) continue;
            const lbl = document.createElement('div');
            lbl.className = 'task-table-label';
            lbl.textContent = label;
            preview.appendChild(lbl);
            const tbl = document.createElement('table');
            tbl.className = 'task-table';
            tbl.innerHTML = `<thead><tr><th>ID</th><th>Function</th><th>Params</th><th>Pri</th><th>Depends on</th></tr></thead>`;
            const tbody = document.createElement('tbody');
            for (const t of tasks) {
                const tr = document.createElement('tr');
                const deps = (t.depends_on || []).join(', ') || '—';
                // Strip metadata keys from params display — these are top-level only
                const META = new Set(['task_id','priority','depends_on','workflow_type','note','metrics_requested','description','retry_count']);
                const rawParams = t.params || {};
                const cleanParams = Object.fromEntries(Object.entries(rawParams).filter(([k]) => !META.has(k)));
                const paramStr = JSON.stringify(cleanParams);
                const paramShort = paramStr.length > 60 ? paramStr.slice(0, 57) + '…' : paramStr;
                tr.innerHTML = `<td>${escHtml(t.task_id||'?')}</td><td>${escHtml(t.function_name||'?')}</td><td><details style="display:inline"><summary style="cursor:pointer;color:#888;font-size:10px;list-style:none">${escHtml(paramShort)}</summary><div style="margin-top:4px;padding:4px 6px;background:rgba(0,0,0,0.35);border-radius:4px;font-size:10px;color:#9d9d9d;white-space:pre-wrap;max-width:360px">${escHtml(JSON.stringify(cleanParams,null,2))}</div></details></td><td>${escHtml(String(t.priority||1))}</td><td>${escHtml(deps)}</td>`;
                tbody.appendChild(tr);
            }
            tbl.appendChild(tbody);
            preview.appendChild(tbl);
        }

        // Approve / Reject buttons
        const row = document.createElement('div');
        row.className = 'approve-row';
        row.innerHTML = `<button class="btn-approve">✅ Approve & Execute</button><button class="btn-reject">✗ Reject</button>`;
        preview.appendChild(row);

        bubble.appendChild(preview);
        scrollMessages();

        const approveBtn = row.querySelector('.btn-approve');
        const rejectBtn  = row.querySelector('.btn-reject');

        approveBtn.onclick = async () => {
            approveBtn.disabled = true;
            rejectBtn.disabled = true;
            approveBtn.textContent = '⏳ Executing…';
            try {
                const res = await fetch(`${apiUrl}/approve/${data.thread_id}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.detail || `HTTP ${res.status}`);
                }
                const result = await res.json();

                // Replace preview with execution summary + rich UI panels + final response
                preview.remove();
                addExecSummary(bubble, result.execution_results || []);
                addHealthSection(bubble, result.execution_results || []);
                addPortfolioStats(bubble, result.execution_results || []);
                addTradesSection(bubble, result.execution_results || []);
                addTelemetryPanel(bubble, result.execution_results || []);
                addText(bubble, result.final_response || '(no response)');
                scrollMessages();
            } catch (e) {
                approveBtn.disabled = false;
                rejectBtn.disabled = false;
                approveBtn.textContent = '✅ Approve & Execute';
                addError(bubble, 'Approval failed: ' + e.message);
            } finally {
                isStreaming = false;
                document.getElementById('sendBtn').disabled = false;
            }
        };

        rejectBtn.onclick = async () => {
            approveBtn.disabled = true;
            rejectBtn.disabled = true;
            try {
                await fetch(`${apiUrl}/reject/${data.thread_id}`, { method: 'POST' });
            } catch (_) {}
            preview.remove();
            addText(bubble, '↩ Task execution cancelled.');
            scrollMessages();
            isStreaming = false;
            document.getElementById('sendBtn').disabled = false;
        };
    }

    // ── Post-approval rich UI panels ─────────────────────────

    function addHealthSection(bubble, execResults) {
        const healthResult = execResults.find(
            r => r.function_name === 'check_portfolio_health' && r.status === 'success' && r.result
        );
        if (!healthResult) return;
        const h = healthResult.result;
        const overall = (h.overall_status || h.status || h.health_status || 'unknown').toLowerCase();

        const colorMap = {
            healthy: { fg: '#6ee7b7', bg: '#0a2a1a' },
            ok:      { fg: '#6ee7b7', bg: '#0a2a1a' },
            warning: { fg: '#fde68a', bg: '#2a1a00' },
            critical:{ fg: '#f87171', bg: '#2d1515' },
            unknown: { fg: '#888',    bg: '#1a1a1a' },
        };
        const col = colorMap[overall] || colorMap.unknown;

        const section = document.createElement('div');
        section.className = 'health-section';
        section.style.borderColor = col.fg + '44';
        section.style.background = col.bg;

        const hdr = document.createElement('div');
        hdr.className = 'health-section-header';
        hdr.textContent = 'Portfolio Health';
        section.appendChild(hdr);

        const badgeRow = document.createElement('div');
        const badge = document.createElement('span');
        badge.className = 'health-badge';
        badge.style.cssText = `color:${col.fg};border-color:${col.fg}66;background:${col.fg}18`;
        badge.textContent = overall.toUpperCase();
        badgeRow.appendChild(badge);

        // Show reason / description if available
        const desc = h.reason || h.description || h.message || '';
        if (desc) {
            const d = document.createElement('span');
            d.style.cssText = 'font-size:12px;color:#aaa;';
            d.textContent = escHtml(String(desc).slice(0, 120));
            badgeRow.appendChild(d);
        }
        section.appendChild(badgeRow);

        // Key metrics grid
        const metricKeys = [
            ['equity', 'Equity'], ['cash', 'Cash'], ['buying_power', 'Buying Power'],
            ['position_count', 'Positions'], ['risk_score', 'Risk Score'],
            ['max_drawdown', 'Max Drawdown'], ['daily_pnl', 'Daily P&L'],
        ];
        const metricsDiv = document.createElement('div');
        metricsDiv.className = 'health-metrics';
        let shown = 0;
        for (const [k, label] of metricKeys) {
            if (h[k] !== undefined && shown < 6) {
                const row = document.createElement('div');
                row.className = 'hm-row';
                row.innerHTML = `<span class="hm-key">${label}:</span><span class="hm-val">${escHtml(String(h[k]))}</span>`;
                metricsDiv.appendChild(row);
                shown++;
            }
        }
        if (shown > 0) section.appendChild(metricsDiv);

        bubble.appendChild(section);
    }

    function addPortfolioStats(bubble, execResults) {
        // Pull from get_portfolio_status or get_positions_summary result
        const statusResult = execResults.find(
            r => (r.function_name === 'get_portfolio_status' || r.function_name === 'get_positions_summary')
                && r.status === 'success' && r.result
        );
        if (!statusResult) return;
        const d = statusResult.result;

        // Collect any numeric stats available
        const statDefs = [
            { key: 'equity',         label: 'Equity' },
            { key: 'cash',           label: 'Cash' },
            { key: 'unrealized_pl',  label: 'Unrealized P&L' },
            { key: 'realized_pl',    label: 'Realized P&L' },
            { key: 'daily_change',   label: 'Daily Change' },
            { key: 'total_return',   label: 'Total Return' },
            { key: 'sharpe_ratio',   label: 'Sharpe Ratio' },
            { key: 'max_drawdown',   label: 'Max Drawdown' },
            { key: 'win_rate',       label: 'Win Rate' },
            { key: 'position_count', label: 'Positions' },
        ];
        const available = statDefs.filter(s => d[s.key] !== undefined);
        if (available.length === 0) return;

        const section = document.createElement('div');
        section.className = 'stats-section';

        const hdr = document.createElement('div');
        hdr.className = 'stats-section-header';
        hdr.textContent = 'Portfolio Stats';
        section.appendChild(hdr);

        const cards = document.createElement('div');
        cards.className = 'stats-cards';
        for (const { key, label } of available.slice(0, 8)) {
            const val = d[key];
            const numVal = typeof val === 'number' ? val : parseFloat(val);
            const isPositive = !isNaN(numVal) && numVal > 0;
            const isNegative = !isNaN(numVal) && numVal < 0;
            const formatted = typeof val === 'number'
                ? (Math.abs(val) >= 1000 ? '$' + val.toLocaleString(undefined, {maximumFractionDigits: 0})
                                         : val.toFixed(2))
                : String(val);
            const card = document.createElement('div');
            card.className = 'stat-card';
            card.innerHTML = `<div class="sc-label">${label}</div><div class="sc-value ${isPositive ? 'positive' : isNegative ? 'negative' : ''}">${escHtml(formatted)}</div>`;
            cards.appendChild(card);
        }
        section.appendChild(cards);
        bubble.appendChild(section);
    }

    function addTradesSection(bubble, execResults) {
        // Find backtest_strategy results that have a trades list
        const btResults = execResults.filter(
            r => r.function_name === 'backtest_strategy' && r.status === 'success' && r.result
        );
        if (btResults.length === 0) return;

        const section = document.createElement('div');
        section.className = 'trades-section';

        for (const btRes of btResults) {
            const d = btRes.result;
            // trades may be at d.trades or d.result.trades
            const trades = d.trades || (d.result && d.result.trades) || [];
            const strategy = d.strategy || d.strategy_name || btRes.task_id || 'backtest';
            const symbol = d.symbol || d.ticker || '';
            const closedTrades = trades.filter(t => t.status === 'closed' || (t.exit_date !== undefined && t.exit_date !== null));
            const openTrades   = trades.filter(t => t.status === 'open'   || (t.exit_date === undefined || t.exit_date === null));
            const perfKeys = ['total_return_pct', 'sharpe_ratio', 'max_drawdown_pct', 'win_rate', 'final_capital'];

            const det = document.createElement('details');
            det.className = 'trades-detail';

            const sumEl = document.createElement('summary');
            sumEl.innerHTML = `📈 Trades &mdash; ${escHtml(strategy)}${symbol ? ' &middot; ' + escHtml(symbol) : ''} `
                + `<span style="color:#6ee7b7;font-weight:400;font-size:10px">${trades.length} entries</span>`
                + `&nbsp;<span style="color:#f87171;font-weight:400;font-size:10px">${closedTrades.length} exits</span>`
                + (openTrades.length ? `&nbsp;<span style="color:#a78bfa;font-weight:400;font-size:10px">${openTrades.length} open</span>` : '');
            det.appendChild(sumEl);

            // Performance summary bar (from metrics dict if available)
            const metrics = d.metrics || {};
            const perfBarItems = [
                ['Return',     metrics.total_return_pct  !== undefined ? (parseFloat(metrics.total_return_pct) >= 0 ? '+' : '') + parseFloat(metrics.total_return_pct).toFixed(2) + '%' : null, true],
                ['Sharpe',     metrics.sharpe_ratio      !== undefined ? parseFloat(metrics.sharpe_ratio).toFixed(3)    : null, false],
                ['Max DD',     metrics.max_drawdown_pct  !== undefined ? parseFloat(metrics.max_drawdown_pct).toFixed(2) + '%' : null, true],
                ['Win Rate',   metrics.win_rate          !== undefined ? (parseFloat(metrics.win_rate) * (parseFloat(metrics.win_rate) <= 1 ? 100 : 1)).toFixed(1) + '%' : null, false],
                ['Final Cap',  d.final_capital           !== undefined ? '$' + Number(d.final_capital).toLocaleString('en-US', {maximumFractionDigits: 0}) : null, false],
            ];
            const perfDiv = document.createElement('div');
            perfDiv.style.cssText = 'padding:5px 12px 5px;display:flex;gap:14px;flex-wrap:wrap;font-size:11px;font-family:monospace;border-bottom:1px solid #2a2a00;';
            let perfHasContent = false;
            for (const [label, val, signed] of perfBarItems) {
                if (val === null || val === undefined) continue;
                const numV = parseFloat(val);
                const isPos = !isNaN(numV) && numV > 0;
                const isNeg = !isNaN(numV) && numV < 0;
                const color = signed ? (isPos ? '#6ee7b7' : isNeg ? '#f87171' : '#bbb') : '#bbb';
                perfDiv.innerHTML += `<span><span style="color:#555">${label}:</span> <span style="color:${color}">${escHtml(String(val))}</span></span>`;
                perfHasContent = true;
            }
            if (perfHasContent) det.appendChild(perfDiv);

            if (trades.length === 0) {
                const empty = document.createElement('div');
                empty.style.cssText = 'padding:8px 12px;font-size:11px;color:#555;';
                empty.textContent = 'No trade records in result.';
                det.appendChild(empty);
                section.appendChild(det);
                continue;
            }

            // ── helper: resolve a trade field ──────────────────────────────
            function fmtPrice(v) { return v !== undefined && v !== null ? Number(v).toFixed(2) : '—'; }
            function fmtShares(t) {
                const v = t.quantity !== undefined ? t.quantity : t.shares !== undefined ? t.shares : t.qty;
                return v !== undefined ? String(v) : '—';
            }
            function fmtDate(v) { return v !== undefined && v !== null ? String(v).substring(0, 10) : '—'; }
            function fmtTime(v) {
                if (!v) return '—';
                const s = String(v);
                // pick out HH:MM from timestamp string
                const m = s.match(/T?(\d{2}:\d{2})/);
                return m ? m[1] : s.substring(11, 16) || s.substring(0, 10);
            }
            function signalLabel(sig) {
                if (!sig || typeof sig !== 'object') return '—';
                return sig.signal || sig.type || Object.keys(sig)[0] || '—';
            }

            // ── 📥 Entries (BUY) section ───────────────────────────────────
            const buyHeader = document.createElement('div');
            buyHeader.className = 'trades-sub-header trade-buy-header';
            buyHeader.innerHTML = `📥 Entries <span class="trades-count">${trades.length} buy${trades.length !== 1 ? 's' : ''}</span>`;
            det.appendChild(buyHeader);

            const buyTbl = document.createElement('table');
            buyTbl.className = 'trades-table';
            buyTbl.innerHTML = `<thead><tr>
                <th class="tc-num">#</th>
                <th>Date</th>
                <th>Time</th>
                <th style="text-align:right">Buy Price</th>
                <th style="text-align:right">Shares</th>
                <th>Signal</th>
                <th>Status</th>
            </tr></thead>`;
            const buyTbody = document.createElement('tbody');
            for (const [i, trade] of trades.slice(0, 100).entries()) {
                const isOpen = trade.status === 'open' || !trade.exit_date;
                const entryDate = fmtDate(trade.entry_date || trade.date || trade.timestamp);
                const entryTime = fmtTime(trade.entry_time || trade.timestamp);
                const entryPrice = fmtPrice(trade.entry_price !== undefined ? trade.entry_price : trade.price);
                const shares = fmtShares(trade);
                const signal = signalLabel(trade.entry_signal);
                const statusCell = isOpen
                    ? `<span style="color:#a78bfa">OPEN</span>`
                    : `<span style="color:#888">CLOSED</span>`;
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="tc-num">${i + 1}</td>
                    <td>${escHtml(entryDate)}</td>
                    <td style="color:#888">${escHtml(entryTime)}</td>
                    <td style="text-align:right;color:#6ee7b7">$${escHtml(entryPrice)}</td>
                    <td style="text-align:right">${escHtml(shares)}</td>
                    <td class="tc-signal">${escHtml(signal)}</td>
                    <td style="font-size:10px">${statusCell}</td>`;
                buyTbody.appendChild(tr);
            }
            buyTbl.appendChild(buyTbody);
            det.appendChild(buyTbl);
            if (trades.length > 100) {
                const note = document.createElement('div');
                note.style.cssText = 'padding:2px 8px 4px;font-size:10px;color:#555;font-family:monospace;';
                note.textContent = `… ${trades.length - 100} more entries not shown`;
                det.appendChild(note);
            }

            // ── 📤 Exits (SELL) section ────────────────────────────────────
            const sellHeader = document.createElement('div');
            sellHeader.className = 'trades-sub-header trade-sell-header';
            sellHeader.innerHTML = `📤 Exits <span class="trades-count">${closedTrades.length} sell${closedTrades.length !== 1 ? 's' : ''}</span>`;
            det.appendChild(sellHeader);

            if (closedTrades.length === 0) {
                const noSells = document.createElement('div');
                noSells.style.cssText = 'padding:6px 12px;font-size:11px;color:#555;';
                noSells.textContent = 'No completed exits yet.';
                det.appendChild(noSells);
            } else {
                const sellTbl = document.createElement('table');
                sellTbl.className = 'trades-table';
                sellTbl.innerHTML = `<thead><tr>
                    <th class="tc-num">#</th>
                    <th>Entry Date</th>
                    <th>Exit Date</th>
                    <th style="text-align:right">Entry $</th>
                    <th style="text-align:right">Exit $</th>
                    <th style="text-align:right">Shares</th>
                    <th>Exit Reason</th>
                    <th style="text-align:right">P&amp;L $</th>
                    <th style="text-align:right">P&amp;L %</th>
                </tr></thead>`;
                const sellTbody = document.createElement('tbody');
                let n = 0;
                for (const trade of closedTrades.slice(0, 100)) {
                    n++;
                    const entryDate = fmtDate(trade.entry_date || trade.date);
                    const exitDate  = fmtDate(trade.exit_date);
                    const entryPrice = fmtPrice(trade.entry_price !== undefined ? trade.entry_price : trade.price);
                    const exitPrice  = fmtPrice(trade.exit_price);
                    const shares = fmtShares(trade);

                    const rawReason = trade.exit_reason || trade.reason || '—';
                    const reasonLabel = String(rawReason).replace(/_/g, ' ');

                    const pnl    = trade.pnl !== undefined ? trade.pnl : (trade.profit_loss !== undefined ? trade.profit_loss : null);
                    const pnlPct = trade.pnl_pct !== undefined ? trade.pnl_pct : null;
                    const pnlNum = pnl !== null ? parseFloat(pnl) : null;
                    const pnlPctNum = pnlPct !== null ? parseFloat(pnlPct) : null;
                    const pnlClass = pnlNum !== null ? (pnlNum >= 0 ? 'trade-pnl-pos' : 'trade-pnl-neg') : '';
                    const pnlStr = pnlNum !== null ? (pnlNum >= 0 ? '+$' : '-$') + Math.abs(pnlNum).toFixed(2) : '—';
                    const pnlPctStr = pnlPctNum !== null
                        ? (pnlPctNum >= 0 ? '+' : '') + pnlPctNum.toFixed(2) + '%'
                        : '—';

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="tc-num">${n}</td>
                        <td>${escHtml(entryDate)}</td>
                        <td>${escHtml(exitDate)}</td>
                        <td style="text-align:right;color:#6ee7b7">$${escHtml(entryPrice)}</td>
                        <td style="text-align:right;color:#f87171">$${escHtml(exitPrice)}</td>
                        <td style="text-align:right">${escHtml(shares)}</td>
                        <td style="font-size:10px;color:#888">${escHtml(reasonLabel)}</td>
                        <td style="text-align:right" class="${pnlClass}">${escHtml(pnlStr)}</td>
                        <td style="text-align:right" class="${pnlClass}">${escHtml(pnlPctStr)}</td>`;
                    sellTbody.appendChild(tr);
                }
                sellTbl.appendChild(sellTbody);
                det.appendChild(sellTbl);
                if (closedTrades.length > 100) {
                    const note = document.createElement('div');
                    note.style.cssText = 'padding:2px 8px 4px;font-size:10px;color:#555;font-family:monospace;';
                    note.textContent = `… ${closedTrades.length - 100} more exits not shown`;
                    det.appendChild(note);
                }
            }

            // ── open positions footer ──────────────────────────────────────
            if (openTrades.length > 0) {
                const openNote = document.createElement('div');
                openNote.className = 'trades-open-note';
                openNote.textContent = `⏳ ${openTrades.length} position${openTrades.length !== 1 ? 's' : ''} still open at end of backtest`;
                det.appendChild(openNote);
            }

            section.appendChild(det);
        }
        bubble.appendChild(section);
    }

    function addTelemetryPanel(bubble, execResults) {
        if (!execResults || execResults.length === 0) return;

        // Calculate total duration
        const totalMs = execResults.reduce((s, r) => s + (r.duration_ms || 0), 0);
        const successCount = execResults.filter(r => r.status === 'success').length;
        const errorCount = execResults.filter(r => r.status === 'error').length;

        const det = document.createElement('details');
        det.className = 'telemetry-detail';
        const sumEl = document.createElement('summary');
        sumEl.innerHTML = `⏱ Telemetry — ${execResults.length} tasks · ${totalMs}ms total`
            + (errorCount > 0 ? ` · <span style="color:#f87171">${errorCount} errors</span>` : '');
        det.appendChild(sumEl);

        const tbl = document.createElement('table');
        tbl.className = 'telemetry-table';
        tbl.innerHTML = `<thead><tr><th>Task ID</th><th>Function</th><th>Status</th><th>Duration</th></tr></thead>`;
        const tbody = document.createElement('tbody');
        for (const r of execResults) {
            const tr = document.createElement('tr');
            const statusColor = r.status === 'success' ? '#6ee7b7' : r.status === 'error' ? '#f87171' : '#888';
            tr.innerHTML = `
                <td style="color:#666">${escHtml(r.task_id || '?')}</td>
                <td class="tc-fn">${escHtml(r.function_name || '?')}</td>
                <td style="color:${statusColor}">${escHtml(r.status || '?')}</td>
                <td class="tc-dur">${r.duration_ms !== undefined ? r.duration_ms + 'ms' : '—'}</td>`;
            tbody.appendChild(tr);
        }
        tbl.appendChild(tbody);
        det.appendChild(tbl);
        bubble.appendChild(det);
    }

    function addExecSummary(bubble, execResults) {
        // execResults may be an Array [{task_id, function_name, ...}] (SemiAutoResponse)
        // or a plain Object {task_id: {...}} (legacy graph format)
        const entries = Array.isArray(execResults)
            ? execResults.map(r => [r.task_id || '?', r])
            : Object.entries(execResults || {});
        if (entries.length === 0) return;
        const div = document.createElement('div');
        div.className = 'exec-summary';
        for (const [tid, r] of entries) {
            const row = document.createElement('div');
            row.className = 'exec-summary-row';
            const status = r.status || 'unknown';
            const dur = r.timing ? `${r.timing.duration_ms || 0}ms` : (r.duration_ms ? `${r.duration_ms}ms` : '');
            row.innerHTML = `<span class="esid">${escHtml(tid)}</span><span class="esfn">${escHtml(r.function_name||'?')}</span><span class="esstatus ${status}">${escHtml(status)}</span><span style="color:#555">${escHtml(dur)}</span>`;
            div.appendChild(row);
        }
        bubble.appendChild(div);
    }
</script>
</body>
