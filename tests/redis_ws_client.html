<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redis WebSocket Proxy Test Client</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .controls {
            background: #252526;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #3e3e42;
        }
        .controls h2 {
            margin-top: 0;
            color: #569cd6;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #9cdcfe;
        }
        input {
            width: 100%;
            padding: 8px;
            background: #3c3c3c;
            border: 1px solid #555;
            color: #d4d4d4;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            background: #0e639c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
        }
        button:hover {
            background: #1177bb;
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .disconnect {
            background: #c5302e;
        }
        .disconnect:hover {
            background: #e04442;
        }
        .status {
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        .status.disconnected {
            background: #3c3c3c;
            border: 1px solid #555;
        }
        .status.connected {
            background: #0e5a0e;
            border: 1px solid #107c10;
        }
        .status.error {
            background: #5a0e0e;
            border: 1px solid #c5302e;
        }
        .messages {
            background: #252526;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #3e3e42;
            max-height: 600px;
            overflow-y: auto;
        }
        .messages h2 {
            margin-top: 0;
            color: #569cd6;
        }
        .message {
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
            font-size: 12px;
            border-left: 3px solid;
        }
        .message.connection {
            background: #1e3a5f;
            border-left-color: #569cd6;
        }
        .message.trade {
            background: #1e5a1e;
            border-left-color: #6cc644;
        }
        .message.bar {
            background: #5a3e1e;
            border-left-color: #f0ad4e;
        }
        .message.error {
            background: #5a1e1e;
            border-left-color: #e74c3c;
        }
        .message.disconnect {
            background: #3c3c3c;
            border-left-color: #777;
        }
        .message .type {
            font-weight: bold;
            color: #9cdcfe;
            margin-right: 10px;
        }
        .message .timestamp {
            color: #888;
            font-size: 11px;
            float: right;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .stat {
            background: #2d2d30;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #3e3e42;
        }
        .stat-label {
            color: #9cdcfe;
            font-size: 12px;
            margin-bottom: 5px;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #d7ba7d;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="controls">
            <h2>🔌 Redis WebSocket Proxy Test Client</h2>

            <div class="status disconnected" id="status">
                <strong>Status:</strong> Disconnected
            </div>

            <div class="form-group">
                <label for="server">WebSocket Server URL:</label>
                <input type="text" id="server" value="ws://localhost:8000/v1/redis/stream/">
            </div>

            <div class="form-group">
                <label for="symbol">Symbol:</label>
                <input type="text" id="symbol" value="AAPL" placeholder="e.g., AAPL, MSFT">
            </div>

            <div>
                <button onclick="connect()" id="connectBtn">Connect</button>
                <button onclick="disconnect()" id="disconnectBtn" class="disconnect" disabled>Disconnect</button>
                <button onclick="clearMessages()">Clear Messages</button>
            </div>

            <div class="stats">
                <div class="stat">
                    <div class="stat-label">Total Messages</div>
                    <div class="stat-value" id="totalMessages">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Trades</div>
                    <div class="stat-value" id="tradeCount">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Bars</div>
                    <div class="stat-value" id="barCount">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Errors</div>
                    <div class="stat-value" id="errorCount">0</div>
                </div>
            </div>
        </div>

        <div class="messages">
            <h2>📊 Messages</h2>
            <div id="messageLog"></div>
        </div>
    </div>

    <script>
        let ws = null;
        let stats = {
            total: 0,
            trades: 0,
            bars: 0,
            errors: 0
        };

        function updateStatus(text, className) {
            const status = document.getElementById('status');
            status.innerHTML = `<strong>Status:</strong> ${text}`;
            status.className = `status ${className}`;
        }

        function updateStats() {
            document.getElementById('totalMessages').textContent = stats.total;
            document.getElementById('tradeCount').textContent = stats.trades;
            document.getElementById('barCount').textContent = stats.bars;
            document.getElementById('errorCount').textContent = stats.errors;
        }

        function addMessage(type, data) {
            const log = document.getElementById('messageLog');
            const message = document.createElement('div');
            message.className = `message ${type}`;

            const timestamp = new Date().toLocaleTimeString();
            const dataStr = JSON.stringify(data, null, 2);

            message.innerHTML = `
                <span class="type">[${type.toUpperCase()}]</span>
                <span class="timestamp">${timestamp}</span>
                <pre>${dataStr}</pre>
            `;

            log.insertBefore(message, log.firstChild);

            // Keep only last 50 messages
            if (log.children.length > 50) {
                log.removeChild(log.lastChild);
            }

            // Update stats
            stats.total++;
            if (type === 'trade') stats.trades++;
            else if (type === 'bar') stats.bars++;
            else if (type === 'error') stats.errors++;
            updateStats();
        }

        function connect() {
            const server = document.getElementById('server').value;
            const symbol = document.getElementById('symbol').value.toUpperCase();
            const url = `${server}${symbol}`;

            if (ws) {
                console.log('Already connected');
                return;
            }

            console.log(`Connecting to ${url}...`);
            updateStatus(`Connecting to ${symbol}...`, 'disconnected');

            ws = new WebSocket(url);

            ws.onopen = () => {
                console.log('WebSocket connected');
                updateStatus(`Connected to ${symbol}`, 'connected');
                document.getElementById('connectBtn').disabled = true;
                document.getElementById('disconnectBtn').disabled = false;
                addMessage('connection', { message: `Connected to ${url}` });
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    console.log(`[${data.type}]`, data);
                    addMessage(data.type, data);
                } catch (err) {
                    console.error('Failed to parse message:', err);
                    addMessage('error', { message: 'Failed to parse message', raw: event.data });
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                updateStatus('Error', 'error');
                addMessage('error', { message: 'WebSocket error occurred' });
            };

            ws.onclose = () => {
                console.log('WebSocket disconnected');
                updateStatus('Disconnected', 'disconnected');
                document.getElementById('connectBtn').disabled = false;
                document.getElementById('disconnectBtn').disabled = true;
                addMessage('disconnect', { message: 'Connection closed' });
                ws = null;
            };
        }

        function disconnect() {
            if (ws) {
                console.log('Disconnecting...');
                ws.close();
                ws = null;
            }
        }

        function clearMessages() {
            document.getElementById('messageLog').innerHTML = '';
            stats = { total: 0, trades: 0, bars: 0, errors: 0 };
            updateStats();
        }

        // Auto-connect on load (optional)
        // window.addEventListener('load', connect);
    </script>
</body>
</html>
